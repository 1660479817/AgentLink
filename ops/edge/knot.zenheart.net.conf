proxy_cache_path /var/cache/nginx/knot_uploads levels=1:2 keys_zone=knot_uploads:10m max_size=2g inactive=7d use_temp_path=off;

server {
    server_name knot.zenheart.net;

    client_max_body_size 52m;

    location /.well-known/acme-challenge/ {
        root /var/www/knot;
    }

    # 隧道在 bot01 上连的是本机，管理接口不能跟着公开。
    location ^~ /api/admin {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    # 上传文件（信息流图片 /display、头像、赞助图）：边缘缓存，避免每张图都穿隧道回 bot01。
    #
    # 缓存键只有 $uri，不含会话，所以「能不能进共享缓存」完全交给后端的 Cache-Control：
    #   - 头像、赞助图、未登录也能读的公开内容 → public，进缓存；
    #   - 只有当事人能读的内容（自己的私帖、wish 的回复）→ private，nginx 不缓存；
    #   - 生成失败回退原件 → no-store，不缓存。
    # 下架不会让缓存立刻失效：条目到期前仍按旧响应分发，所以 max-age 设为 1 天而不是 7 天。
    location ^~ /api/web/uploads/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache knot_uploads;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Knot-Cache $upstream_cache_status;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /help {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        root /var/www/knot;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /assets/ {
        root /var/www/knot;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 发现页的公开快照。文件由 bot01 推上来；还没有文件时回到隧道。
    location = /discover.json {
        root /var/www/knot;
        try_files /discover.json @knot_origin;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /media/previews/ {
        root /var/www/knot;
        try_files $uri @knot_origin;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location @knot_origin {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # 静态文件与 SPA 兜底。反代位置不写这两个头，交给 Backend，免得同一个值出现两行。
    location / {
        root /var/www/knot;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/knot.zenheart.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/knot.zenheart.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = knot.zenheart.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name knot.zenheart.net;
    return 404; # managed by Certbot
}
