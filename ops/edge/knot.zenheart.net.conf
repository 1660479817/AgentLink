server {
    server_name knot.zenheart.net;

    client_max_body_size 16m;

    location /.well-known/acme-challenge/ {
        root /var/www/knot;
    }

    # 隧道在 bot01 上连的是本机，管理接口不能跟着公开。
    location ^~ /api/admin {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /help {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        root /var/www/knot;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /var/www/knot;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/knot.zenheart.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/knot.zenheart.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = knot.zenheart.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name knot.zenheart.net;
    return 404; # managed by Certbot
}
