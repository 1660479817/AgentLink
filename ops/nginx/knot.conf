# Knot Phase 0 — 192.168.3.91 同机
# 安装：sudo cp ops/nginx/knot.conf /etc/nginx/sites-available/knot
#       sudo ln -sf /etc/nginx/sites-available/knot /etc/nginx/sites-enabled/
#       修改 root / server_name 后：sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.3.91;

    client_max_body_size 16m;

    root /home/zenwang_bot01/knot/AgentLink/apps/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
