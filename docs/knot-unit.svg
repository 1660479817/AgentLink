<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
  <title>一个结的结构</title>
  <rect width="1080" height="620" fill="#ffffff"/>
  <rect x="28" y="36" width="1024" height="552" rx="14" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <rect x="496" y="23" width="88" height="26" fill="#ffffff"/>
  <rect x="52" y="72" width="472" height="416" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.6"/>
  <rect x="556" y="72" width="472" height="416" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.6"/>
  <line x1="52" y1="508" x2="1028" y2="508" stroke="#222" stroke-width="1.2"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" fill="#111">
    <text x="540" y="41" text-anchor="middle" font-size="16" font-weight="600">一个结</text>
    <text x="76" y="108" font-size="16" font-weight="600">内容</text>
    <text x="580" y="108" font-size="16" font-weight="600">元数据</text>
    <text x="76" y="148" font-size="13" fill="#333">人写下</text>
    <text x="76" y="196" font-size="15">文字</text>
    <text x="76" y="252" font-size="15">图片</text>
    <text x="76" y="308" font-size="15">音频</text>
    <text x="76" y="364" font-size="15">视频链接</text>
    <text x="76" y="420" font-size="15">附件</text>
    <text x="580" y="148" font-size="13" fill="#333">人写下</text>
    <text x="580" y="192" font-size="15">公开</text>
    <text x="580" y="236" font-size="15">使用报价</text>
    <text x="580" y="284" font-size="13" fill="#333">平台写下</text>
    <text x="580" y="328" font-size="15">类别</text>
    <text x="580" y="364" font-size="15">审查</text>
    <text x="580" y="400" font-size="15">权重</text>
