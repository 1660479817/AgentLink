    <text x="1004" y="400" text-anchor="end">点亮的人数</text>
    <text x="1004" y="436" text-anchor="end">卡片上的时间</text>
    <text x="1004" y="472" text-anchor="end">目前与提交相同</text>
    <text x="124" y="540" font-size="14">正文、视频链接、类别、使用报价，以及图片、音频和附件</text>
    <text x="138" y="568" font-size="14">有图片、音频或附件时才提供。readme.txt 写上结构和正文，这些文件放在包里</text>
