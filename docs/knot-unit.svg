    <text x="76" y="568" font-size="14" font-weight="600">压缩包</text>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" fill="#333">
    <text x="500" y="196" text-anchor="end">可以没有</text>
    <text x="500" y="252" text-anchor="end">最多 4 张</text>
    <text x="500" y="308" text-anchor="end">最多 1 个</text>
    <text x="500" y="364" text-anchor="end">最多 1 条，不存文件</text>
    <text x="500" y="420" text-anchor="end">最多 1 个</text>
    <text x="1004" y="192" text-anchor="end">缺省为公开</text>
    <text x="1004" y="236" text-anchor="end">写下后不变</text>
    <text x="1004" y="328" text-anchor="end">通过后写入</text>
