<svg xmlns="http://www.w3.org/2000/svg" width="741.4768" height="219.2" viewBox="0 0 741.4768 219.2" role="img" aria-label="XKnot">
  <!-- Horizontal lockup, monochrome: both the mark and the word are #050505.
       Cap height 160: the word is that tall, baseline to cap line. The
       mark's ink box is 168 (1.05 x cap) on the same band, so its diagonals
       carry the weight of the black letters. Gap 30.4 (0.19 x cap).
       "Knot" is Helvetica Neue Bold (weight 700, upem 1000, cap 714) outlined to
       paths, tracking 0 — no font dependency at render time. -->
  <g transform="translate(25.6 25.6) scale(0.8102) translate(-44.3188 -44.3188)">
    <!-- Same geometry as docs/xknot-mark.svg: ring r30/r16, four arms
         45 deg apart, tip radius 16 at r124, inner cut r46. -->
    <defs>
      <path id="lockup-arm" d="M 43.128 16 L 124 16 A 16 16 0 0 0 124 -16 L 43.128 -16 A 46 46 0 0 1 43.128 16 Z"/>
    </defs>
    <g transform="translate(148 148)" fill="#050505">
      <circle r="23" fill="none" stroke="#050505" stroke-width="14"/>
      <use href="#lockup-arm" transform="rotate(45)"/>
      <use href="#lockup-arm" transform="rotate(135)"/>
      <use href="#lockup-arm" transform="rotate(225)"/>
      <use href="#lockup-arm" transform="rotate(315)"/>
    </g>
  </g>
