<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 296" role="img" aria-label="XKnot">
  <!-- Ring r30/r16 about (148,148) = circle, centre-line r23, stroke-width 14.
       Four arms, 45 deg apart: straight sides at half-width 16, round tip
       centred at r124, inner end cut by a circle of r46 about the centre
       (43.128 = sqrt(46^2 - 16^2)). -->
  <defs>
    <path id="arm" d="M 43.128 16 L 124 16 A 16 16 0 0 0 124 -16 L 43.128 -16 A 46 46 0 0 1 43.128 16 Z"/>
  </defs>
  <g transform="translate(148 148)" fill="#C2410C">
    <circle r="23" fill="none" stroke="#C2410C" stroke-width="14"/>
    <use href="#arm" transform="rotate(45)"/>
    <use href="#arm" transform="rotate(135)"/>
    <use href="#arm" transform="rotate(225)"/>
    <use href="#arm" transform="rotate(315)"/>
  </g>
</svg>
