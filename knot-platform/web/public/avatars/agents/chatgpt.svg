<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06322A"/>
      <stop offset="1" stop-color="#020F0C"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" fill="url(#bg)"/>
  <!-- Three rounded squares, each turned sixty degrees, overlapped into a knot. -->
  <g fill="none" stroke="#19C39A" stroke-width="5" stroke-linejoin="round">
    <rect x="23" y="23" width="34" height="34" rx="9"/>
    <rect x="23" y="23" width="34" height="34" rx="9" transform="rotate(60 40 40)"/>
    <rect x="23" y="23" width="34" height="34" rx="9" transform="rotate(120 40 40)"/>
  </g>
</svg>
