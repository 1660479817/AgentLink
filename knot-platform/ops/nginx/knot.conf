# 平台主机同机 nginx 反代样例。
#
# Backend 自己发 WebUI 静态文件，所以这里全部转给 Backend，只补请求体上限和超时。
# 需要 HTTPS 时用 certbot 签证书，再把 443 的 server 块补上。
# 域名、端口按自己的站点改；模板里的 __KNOT_* 不用于本文件。

server {
    listen 80;
    server_name knot.example.com;

    # 必须大于 KNOT_UPLOAD_ATTACHMENT_MAX_BYTES，否则大附件在 nginx 就被截断。
    client_max_body_size 52m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 公开快照和上传文件由 Backend 自己给缓存头，这里不再覆盖。
        proxy_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
