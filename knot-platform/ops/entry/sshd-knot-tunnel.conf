# 入口主机的回源隧道配置：说明文件，不要照抄。
#
# 每台实例一份，从同目录的 sshd-tunnel.conf.template 渲染：
#   node ops/scripts/render-config.mjs ops/entry/sshd-tunnel.conf.template /tmp/sshd-knot.conf
# 再把结果写进入口主机的 sshd 配置并 sshd -t。
#
# 账号与端口必须按子域各不相同：一个子域一个隧道账号、一个回环端口。
# 同一台入口主机上两份 Match 抢同一个 User 或同一个 PermitListen，
# sshd 会直接拒绝加载，已经接通的子域一起断。
#
# 已签发子域的成品不放在本仓库：它属于那台入口主机和那个子域，
# 由 xknot.si/ops/entry/<子域>.conf 与对应的 tunnel runbook 管。
# 原先这里放了一份 knot-tunnel + 18080 的「成品」，照着装第二个子域会撞车，
# 所以只留这份说明。
#
# 模板的两个变量（都来自 site.env）：
#   {{KNOT_TUNNEL_USER}}        该子域的隧道账号，例如 <标签>-tunnel
#   {{KNOT_ENTRY_PROXY_PORT}}   该子域独占的回环端口，例如 18181
