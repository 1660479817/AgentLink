# zjj.xknot.si：xknot 签发子域边缘（签发阶段：静态占位，无隧道反代）。
#
# 静态落边缘 /var/www/zjj。本次仅 DNS A + nginx + Let’s Encrypt + 占位页；
# 不配 /api → 127.0.0.1:18080（避免与 wang 抢同一隧道端口）。
# 日后若 zjj 要隧道，另开端口与 sshd Match，再补 location。
#
# 落地：
#   1. mkdir -p /var/www/zjj；放简单 index.html
#   2. 先只启用 :80 + ACME，certbot certonly --webroot -w /var/www/zjj -d zjj.xknot.si
#   3. 再启用本完整 conf（443），nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name zjj.xknot.si;

    location /.well-known/acme-challenge/ {
        root /var/www/zjj;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zjj.xknot.si;

    ssl_certificate /etc/letsencrypt/live/zjj.xknot.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zjj.xknot.si/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 52m;

    location /.well-known/acme-challenge/ {
        root /var/www/zjj;
    }

    location = /index.html {
        root /var/www/zjj;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        root /var/www/zjj;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
