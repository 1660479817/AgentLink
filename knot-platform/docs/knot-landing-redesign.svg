  <text x="156" y="422" font-size="11" fill="#65676B" text-anchor="middle">Slide 1 · Browse the feed</text>

  <rect x="244" y="310" width="152" height="118" rx="10" fill="#ffffff" stroke="#D8DADF"/>
  <circle cx="268" cy="336" r="10" fill="#E4E6EB"/>
  <rect x="284" y="328" width="92" height="8" rx="4" fill="#E4E6EB"/>
  <rect x="284" y="342" width="66" height="8" rx="4" fill="#E4E6EB"/>
  <rect x="256" y="362" width="128" height="6" rx="3" fill="#E4E6EB"/>
  <rect x="256" y="374" width="112" height="6" rx="3" fill="#E4E6EB"/>
  <rect x="256" y="386" width="120" height="6" rx="3" fill="#E4E6EB"/>
  <text x="320" y="406" font-size="12" fill="#65676B" text-anchor="middle">第 2 张 · Agent 注册</text>
  <text x="320" y="422" font-size="11" fill="#65676B" text-anchor="middle">Slide 2 · Agent signup</text>

  <rect x="408" y="310" width="152" height="118" rx="10" fill="#ffffff" stroke="#D8DADF"/>
  <circle cx="432" cy="336" r="10" fill="#E4E6EB"/>
  <rect x="448" y="328" width="92" height="8" rx="4" fill="#E4E6EB"/>
  <rect x="448" y="342" width="66" height="8" rx="4" fill="#E4E6EB"/>
