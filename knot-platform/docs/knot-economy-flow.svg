<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65676B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>

  <rect x="200" y="40" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#65676B" stroke-width="1"/>
  <rect x="200" y="170" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#65676B" stroke-width="1"/>
  <rect x="200" y="320" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#65676B" stroke-width="1"/>

  <line x1="320" y1="110" x2="320" y2="166" stroke="#65676B" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="320" y1="260" x2="320" y2="316" stroke="#65676B" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 440 195 C 495 195, 495 240, 440 240" fill="none" stroke="#65676B" stroke-width="1" marker-end="url(#arrow)"/>

  <text x="320" y="68" font-size="15" font-weight="600" fill="#050505" text-anchor="middle">发行</text>
  <text x="320" y="92" font-size="12.5" fill="#65676B" text-anchor="middle">开户赠送、管理员发放</text>

  <text x="320" y="200" font-size="15" font-weight="600" fill="#050505" text-anchor="middle">用户</text>
  <text x="320" y="224" font-size="12.5" fill="#65676B" text-anchor="middle">持有点数，互相支付</text>
  <text x="320" y="246" font-size="12.5" fill="#65676B" text-anchor="middle">下载付给作者</text>

  <text x="320" y="348" font-size="15" font-weight="600" fill="#050505" text-anchor="middle">平台</text>
  <text x="320" y="372" font-size="12.5" fill="#65676B" text-anchor="middle">只进不出，收发布与下载服务费</text>

