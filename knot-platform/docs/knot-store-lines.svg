<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1120" height="500" fill="#ffffff"/>

  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="24" y="42" font-size="20" font-weight="700" fill="#111">Knot · 三条线各走各的</text>
    <text x="24" y="66" font-size="13" fill="#333">内容不卖，店面不结算。只在两处相碰：发帖扣积分、成交转账。</text>
    <text x="24" y="86" font-size="12" fill="#555">Content is not for sale, the store does not settle. Two crossings: publish fee, and a sale.</text>
  </g>

  <!-- 内容线 -->
  <rect x="24" y="104" width="320" height="84" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="1.6"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="44" y="136" font-size="16" font-weight="600" fill="#111">内容 · Content</text>
    <text x="44" y="160" font-size="12" fill="#333">post · fastpost</text>
    <text x="44" y="178" font-size="12" fill="#333">无标价 · 无交易期</text>
  </g>
  <g fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="344" y1="146" x2="380" y2="146"/>
  </g>
  <rect x="384" y="104" width="320" height="84" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="404" y="136" font-size="15" font-weight="600" fill="#111">信息流 · 搜索 · 快照</text>
    <text x="404" y="160" font-size="12" fill="#333">feed · search · discover.json</text>
    <text x="404" y="178" font-size="12" fill="#333">附件免费下载</text>
  </g>

  <!-- 店面线 -->
  <rect x="24" y="208" width="320" height="84" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="1.6"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="44" y="240" font-size="16" font-weight="600" fill="#111">店面 · Store</text>
    <text x="44" y="264" font-size="12" fill="#333">item · order</text>
    <text x="44" y="282" font-size="12" fill="#333">标价 · 在售 · 成交</text>
  </g>
  <g fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="344" y1="250" x2="380" y2="250"/>
  </g>
  <rect x="384" y="208" width="320" height="84" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="404" y="240" font-size="15" font-weight="600" fill="#111">货架 · /store</text>
    <text x="404" y="264" font-size="12" fill="#333">商品列表 · 我的挂售 · 我的订单</text>
    <text x="404" y="282" font-size="12" fill="#333">不进信息流 · 不进搜索 · 不进快照</text>
  </g>

  <!-- 结算线 -->
  <rect x="384" y="336" width="712" height="96" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="404" y="368" font-size="16" font-weight="600" fill="#111">结算 · Settlement</text>
    <text x="404" y="392" font-size="12" fill="#333">积分余额 · 流水 · 发布费 · 打赏 · 消费券</text>
    <text x="404" y="414" font-size="12" fill="#333">balance · ledger · publish fee · tip · coupons</text>
  </g>

  <g fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)">
    <polyline points="704,146 780,146 780,332"/>
    <polyline points="704,250 880,250 880,332"/>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#333">
    <text x="790" y="188">发布费 · 打赏</text>
    <text x="790" y="204" fill="#555">publish fee · tip</text>
    <text x="890" y="292">成交</text>
    <text x="890" y="308" fill="#555">buy −price / sell +price</text>
  </g>

  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="24" y="462" font-size="13" fill="#333">帖子没有价格，不进交易链；商品只在货架上，收益全部归卖家，平台不抽成。</text>
    <text x="24" y="482" font-size="12" fill="#555">A post has no price and never enters trade; an item lives only on the shelf, the seller keeps the whole price.</text>
  </g>
</svg>
