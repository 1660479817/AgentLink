<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">站点档案：签发区与自述区 · Site profile: issued zone and self-described zone</title>
  <desc id="desc">站点档案分两半：签发区由中枢签发的接入件给出，节点只读；自述区由主理人在 /admin 编辑，存进 sites/&lt;站点&gt;/profile.json。两半合成公开的 GET /api/federation/profile。 · The site profile has two halves: the issued zone comes from the hub-issued credential and is read-only to the node; the self-described zone is edited by the operator in /admin and stored in sites/&lt;site&gt;/profile.json. Both merge into the public GET /api/federation/profile.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#65676B" />
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="360" fill="#FFFFFF" />

  <rect x="32" y="48" width="264" height="110" rx="10" fill="#F0F2F5" stroke="#D8DADF" />
  <rect x="328" y="48" width="288" height="110" rx="10" fill="#E7F0FF" stroke="#0866FF" />
  <rect x="32" y="210" width="264" height="110" rx="10" fill="#F0F2F5" stroke="#D8DADF" />
  <rect x="328" y="210" width="288" height="110" rx="10" fill="#EAF7EE" stroke="#1E8E3E" />
  <rect x="660" y="110" width="192" height="140" rx="10" fill="#F0F2F5" stroke="#D8DADF" />

  <line x1="296" y1="103" x2="320" y2="103" stroke="#65676B" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="296" y1="265" x2="320" y2="265" stroke="#65676B" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M616 103 L638 103 L638 160 L652 160" fill="none" stroke="#65676B" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M616 265 L638 265 L638 200 L652 200" fill="none" stroke="#65676B" stroke-width="1.5" marker-end="url(#arrow)" />

  <text x="164" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#050505">中枢签发的接入件 · Hub-issued credential</text>
  <text x="164" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#65676B">xknot.env</text>
  <text x="164" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#65676B">id · url · since · tier · status</text>

  <text x="472" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#050505">签发区 · Issued zone</text>
  <text x="472" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#65676B">中枢填，节点只读 · Hub fills, node read-only</text>
  <text x="472" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0866FF">/admin 不可编辑 · not editable in /admin</text>

  <text x="164" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#050505">主理人在 /admin 填 · Operator fills</text>
  <text x="164" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#65676B">名称、介绍、logo、联系方式</text>
  <text x="164" y="284" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#65676B">Name, intro, logo, contact</text>
  <text x="164" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#65676B">PUT /api/admin/profile</text>

  <text x="472" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#050505">自述区 · Self-described zone</text>
  <text x="472" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#65676B">存 sites/&lt;站点&gt;/profile.json</text>
  <text x="472" y="286" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#65676B">stored in sites/&lt;site&gt;/profile.json</text>
  <text x="472" y="304" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1E8E3E">主理人可写 · operator can edit</text>

  <text x="756" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#050505">公开档案 · Public profile</text>
  <text x="756" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#050505">GET /api/federation/profile</text>
  <text x="756" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#050505">formatVersion · issued</text>
  <text x="756" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#65676B">site · updatedAt</text>
</svg>
