# 整站容器部署：Knot Backend + PostgreSQL 16。
#
#   cp .env.example .env      # 改管理员邮箱和站点身份
#   docker compose up -d --build
#   curl http://127.0.0.1:8080/api/health
#
# 升级：docker compose up -d --build
# 回滚：把镜像标签换回上一个版本（推荐在 CI 里给镜像打版本标签）。
#
# 这是与 macOS/launchd、Linux/systemd 并列的第三条部署路径。
# 它自己带数据库，不读 sites/<站点>/site.env。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: knot
      POSTGRES_DB: knot
      POSTGRES_PASSWORD: ${KNOT_DB_PASSWORD:-knot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knot -d knot"]
      interval: 5s
      timeout: 3s
      retries: 20

  knot:
    build: .
    image: knot-platform:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://knot:${KNOT_DB_PASSWORD:-knot}@db:5432/knot
      PORT: "8080"
      BIND_HOST: 0.0.0.0
      UPLOAD_DIR: /data/uploads
      STATIC_WEB_DIR: /app/web/dist
      # 站点键和运行时名不同的几项在这里映射，和 platform.env 的写法一致。
      PUBLIC_WEB_ORIGIN: ${KNOT_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      SESSION_COOKIE_NAME: ${KNOT_SESSION_COOKIE_NAME:-knot_sid}
    ports:
      - "${KNOT_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    # 先迁移再启动。迁移是幂等的；旧表结构要重建时会停下并报错，不会静默清库。
    command: ["sh", "-c", "node backend/scripts/migrate.js && exec node backend/src/index.js"]

volumes:
  pgdata:
  uploads:
