# wang.xknot.si：xknot 签发子域边缘模板（隧道反代）。
#
# 静态可落边缘 /var/www/wang，动态 /api 经 127.0.0.1:18080 回内网实例
# （SSH -R，见 ops/edge/README.md）。
# 通配多租户（*.xknot.si 自动 server）另任务；本文件是单子域手工模板。
#
# 落地：
#   1. mkdir -p /var/www/wang；可放简单 index.html
#   2. 先只启用 :80 + ACME，certbot certonly --webroot -w /var/www/wang -d wang.xknot.si
#   3. 再启用本完整 conf（443），nginx -t && systemctl reload nginx
#   4. 边缘 sshd 需已配置隧道用户的 Match 块（PermitListen 127.0.0.1:18080，见 ops/edge/README.md）

server {
    listen 80;
    listen [::]:80;
    server_name wang.xknot.si;

    location /.well-known/acme-challenge/ {
        root /var/www/wang;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wang.xknot.si;

    ssl_certificate /etc/letsencrypt/live/wang.xknot.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wang.xknot.si/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 52m;

    location /.well-known/acme-challenge/ {
        root /var/www/wang;
    }

    # 隧道在实例侧连的是本机，管理接口不能跟着公开。
    location ^~ /api/admin {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /help {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        root /var/www/wang;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /assets/ {
        root /var/www/wang;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 发现页公开快照：有文件用边缘，缺了回落隧道（与 knot 同思路）。
    location = /discover.json {
        root /var/www/wang;
        try_files /discover.json @wang_origin;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location @wang_origin {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        root /var/www/wang;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
