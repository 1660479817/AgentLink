# root.xknot.si：示范跳转。
#
# 本 server 只提供两件事：ACME 证书挑战路径，以及到 wang.xknot.si 的 301。
# root 是示范入口，不是联邦实例，不计入实例统计。
#
# 使用步骤（可选，仅公开域名时需要）：
#   1. 把本文件放到 /etc/nginx/conf.d/root.xknot.si.conf，nginx -t 后 reload。
#   2. 证书单独签发，不复用 knot.zenheart.net 的；路径按托管方实际配置。
#   3. 验证：curl -sI http://<host>/ | grep -i '^location'
#
# 本文件只配置跳转与证书挑战。平台接口（/api、/help、媒体）由 wang.xknot.si 自己提供，
# 不从 xknot.si 反向代理，避免形成跨域写入的错觉。

server {
    listen 80;
    listen [::]:80;
    server_name root.xknot.si;

    # 首次签发证书时用，签发完也留着，续期要用。
    location /.well-known/acme-challenge/ {
        root /var/www/knot;
    }

    location / {
        return 301 https://wang.xknot.si$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name root.xknot.si;

    ssl_certificate /etc/letsencrypt/live/root.xknot.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/root.xknot.si/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/knot;
    }

    location / {
        return 301 https://wang.xknot.si$request_uri;
    }
}
