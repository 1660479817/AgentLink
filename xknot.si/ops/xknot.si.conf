# xknot.si：中枢门户。
#
# 静态文件位于 /var/www/xknot，内容由 web/dist 同步而来（见 ops/deploy-hub.sh）。
# /api/ 与 /admin/ 反代到本机的接口进程（server/index.mjs，默认 127.0.0.1:5181），
# 接口只监听回环，不要给它开放公网端口。
#
# 当前：仅 listen 80（DNS / 证书尚未切到本机前）。NS 切到 Route53 并 certbot 后，
# 取消下方「HTTPS（有证后启用）」整块注释，并把 80 的 location / 改回 301 到 https。
# 详见 ops/README-deploy-aws.md。
#
# 使用步骤：
#   1. 把 web/dist 同步到 /var/www/xknot。
#   2. 把本文件放到 /etc/nginx/conf.d/xknot.si.conf，nginx -t 后 reload。
#   3. 验证：curl -sI -H 'Host: xknot.si' http://<host>/
#   4. 接口进程用 systemd 常驻，环境变量见 docs/HUB.md 第 7.2 节。

# 申请与登录各一条限流；进程内还有一层按来源哈希的限流。
limit_req_zone $binary_remote_addr zone=xknot_apply:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=xknot_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name xknot.si www.xknot.si;

    root /var/www/xknot;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /.well-known/acme-challenge/ {
        root /var/www/xknot;
    }

    location = / {
        return 302 /en/;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /data/hub.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.html$ {
        expires -1;
    }

    location /en/ {
        try_files $uri $uri/ =404;
    }

    location /zh-CN/ {
        try_files $uri $uri/ =404;
    }

    location /zh-TW/ {
        try_files $uri $uri/ =404;
    }

    # 加入申请与审核台：反代到本机接口进程。
    location /api/ {
        limit_req zone=xknot_apply burst=5 nodelay;
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
        proxy_read_timeout 15s;
    }

    # 登录接口单独限流；/api/ 的前缀匹配会被更长的前缀覆盖。
    location /api/admin/login {
        limit_req zone=xknot_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

